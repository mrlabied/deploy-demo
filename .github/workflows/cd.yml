name: CD - Build, Infra & Deploy

on:
  workflow_run:
    workflows: ["CI"] # Doit correspondre exactement au 'name:' de votre fichier ci.yml
    types:
      - completed
    branches: [main]

jobs:
  docker-build-push:
    name: Build & Push Image Docker
    # Ne s'exécute que si la CI a réussi
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_short }}
    environment: production      
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Générer le tag de version court
        id: meta
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Connexion au registre Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et Push de l'image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-app:${{ steps.meta.outputs.sha_short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-app:latest

  terraform-infra:
    name: Terraform – Infrastructure as Code
    needs: [docker-build-push]
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Initialiser Terraform
        run: terraform init

      - name: Configurer le kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_CONTENT }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Vérifier le formatage et la syntaxe
        run: |
          terraform fmt -check
          terraform validate

      - name: Planifier les changements (Plan)
        run: terraform plan -out=tfplan -input=false

      - name: Appliquer l'infrastructure (Apply)
        run: terraform apply -auto-approve tfplan

  k8s-deploy:
    name: Kubernetes – Déploiement & Suivi
    needs: [terraform-infra, docker-build-push]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer l'accès au cluster (kubectl)
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Appliquer les manifestes Kubernetes
        run: |
          kubectl apply -f k8s/

      - name: Mettre à jour l'image du conteneur
        run: |
          kubectl set image deployment/fastapi-deployment \
            fastapi=${{ secrets.DOCKERHUB_USERNAME }}/fastapi-app:${{ needs.docker-build-push.outputs.image_tag }} \
            -n fastapi-ns

      - name: Suivre l'état du déploiement (Rollout Status)
        run: |
          kubectl rollout status deployment/fastapi-deployment -n fastapi-ns --timeout=120s

      - name: Vérifier l'état des ressources et test de santé (Smoke Test)
        run: |
          kubectl get pods,svc -n fastapi-ns
          # Vérification HTTP via port-forward en arrière-plan pour valider l'endpoint /health ou /docs
          kubectl port-forward svc/fastapi-service 8080:80 -n fastapi-ns &
          sleep 3
          curl -f http://localhost:8080/docs || (echo "Échec du Smoke Test" && exit 1)